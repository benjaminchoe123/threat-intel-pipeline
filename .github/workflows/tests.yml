name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # windows-latest matters more than ubuntu here: the pipeline is deployed on
    # Windows via Task Scheduler with cp1252 stdout, so the encoding and
    # reserved-filename bugs this suite now covers were invisible to Linux-only CI.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
