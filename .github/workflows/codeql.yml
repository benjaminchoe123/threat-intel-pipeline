name: codeql

# Static analysis. A repo about finding other people's vulnerabilities should be
# willing to have its own code scanned — and this pipeline parses untrusted feed
# input and turns feed-controlled strings into filenames, which is exactly the
# surface CodeQL is good at.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published query class gets applied to code that hasn't changed.
    - cron: "31 4 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
